apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.smartcameraapp"
    defaultConfig {
        applicationId "com.smartcameraapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    aaptOptions {
        noCompress "tflite"
        noCompress "tflite", "lite"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Verify model file exists and has correct size
tasks.register('verifyModelFile') {
    doLast {
        def assetsModel = file('src/main/assets/demo_model.tflite')
        def rawModel = file('src/main/res/raw/demo_model.tflite')
        
        println "========================================="
        println "MODEL FILE VERIFICATION"
        println "========================================="
        
        if (assetsModel.exists()) {
            println "✅ Assets model exists: ${assetsModel.length()} bytes"
        } else {
            println "❌ Assets model NOT FOUND"
        }
        
        if (rawModel.exists()) {
            println "✅ Raw model exists: ${rawModel.length()} bytes"
        } else {
            println "❌ Raw model NOT FOUND"
        }
        
        println "========================================="
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyModelFile'
}

// Ensure model files are not stripped
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.mergeResourcesProvider.configure {
            doLast {
                println "========================================="
                println "AFTER MERGE RESOURCES - Checking model files"
                def mergedAssets = file("${buildDir}/intermediates/merged_assets/${variant.name}/out/demo_model.tflite")
                if (mergedAssets.exists()) {
                    println "✅ Merged assets model: ${mergedAssets.length()} bytes"
                } else {
                    println "❌ Merged assets model NOT FOUND at: ${mergedAssets.absolutePath}"
                }
                println "========================================="
            }
        }
    }
}
