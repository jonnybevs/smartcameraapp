apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.smartcameraapp"
    defaultConfig {
        applicationId "com.smartcameraapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    aaptOptions {
        noCompress "tflite"
        noCompress "tflite", "lite"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Verify model file exists and has correct size
tasks.register('verifyModelFile') {
    doLast {
        def assetsModel = file('src/main/assets/demo_model.tflite')
        def rawModel = file('src/main/res/raw/demo_model.tflite')
        
        println "========================================="
        println "MODEL FILE VERIFICATION"
        println "========================================="
        
        if (assetsModel.exists()) {
            println "✅ Assets model exists: ${assetsModel.length()} bytes"
        } else {
            println "❌ Assets model NOT FOUND"
        }
        
        if (rawModel.exists()) {
            println "✅ Raw model exists: ${rawModel.length()} bytes"
        } else {
            println "❌ Raw model NOT FOUND"
        }
        
        println "========================================="
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyModelFile'
}

// Custom task to copy model file to merged assets
tasks.register('copyModelToMergedAssets') {
    doLast {
        android.applicationVariants.all { variant ->
            if (variant.buildType.name == 'release') {
                def sourceModel = file('src/main/assets/demo_model.tflite')
                def mergedAssetsDir = file("${buildDir}/intermediates/merged_assets/${variant.name}/out")
                def targetModel = new File(mergedAssetsDir, 'demo_model.tflite')
                
                println "========================================="
                println "COPYING MODEL TO MERGED ASSETS"
                println "Source: ${sourceModel.absolutePath}"
                println "Target: ${targetModel.absolutePath}"
                
                if (sourceModel.exists()) {
                    mergedAssetsDir.mkdirs()
                    sourceModel.withInputStream { input ->
                        targetModel.withOutputStream { output ->
                            output << input
                        }
                    }
                    println "✅ Copied model: ${targetModel.length()} bytes"
                } else {
                    println "❌ Source model NOT FOUND"
                }
                println "========================================="
            }
        }
    }
}

// Ensure model files are not stripped
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.mergeAssetsProvider.configure {
            dependsOn 'copyModelToMergedAssets'
            doLast {
                println "========================================="
                println "AFTER MERGE ASSETS - Checking model files"
                def mergedAssets = file("${buildDir}/intermediates/merged_assets/${variant.name}/out/demo_model.tflite")
                if (mergedAssets.exists()) {
                    println "✅ Merged assets model: ${mergedAssets.length()} bytes"
                } else {
                    println "❌ Merged assets model NOT FOUND at: ${mergedAssets.absolutePath}"
                }
                println "========================================="
            }
        }
        
        // Copy model after compression (the compression task strips it)
        afterEvaluate {
            tasks.findByName('compressReleaseAssets')?.doLast {
                println "========================================="
                println "COPYING MODEL AFTER COMPRESSION"
                def sourceModel = file('src/main/assets/demo_model.tflite')
                def compressedDir = file("${buildDir}/intermediates/compressed_assets/release/out")
                def targetModel = new File(compressedDir, 'demo_model.tflite')
                
                if (sourceModel.exists()) {
                    compressedDir.mkdirs()
                    sourceModel.withInputStream { input ->
                        targetModel.withOutputStream { output ->
                            output << input
                        }
                    }
                    println "✅ Copied model to compressed assets: ${targetModel.length()} bytes"
                } else {
                    println "❌ Source model NOT FOUND"
                }
                println "========================================="
            }
        }
        
        // Check after assembly
        variant.assembleProvider.configure {
            doLast {
                println "========================================="
                println "AFTER APK ASSEMBLY - Checking compressed assets"
                def compressedAssets = file("${buildDir}/intermediates/compressed_assets/release/out/demo_model.tflite")
                if (compressedAssets.exists()) {
                    println "✅ Compressed assets model: ${compressedAssets.length()} bytes"
                } else {
                    println "❌ Compressed assets model NOT FOUND at: ${compressedAssets.absolutePath}"
                }
                
                // Check in final APK
                def apkFile = variant.outputs[0].outputFile
                if (apkFile.exists()) {
                    println "📦 APK file: ${apkFile.absolutePath}"
                    println "📦 APK size: ${apkFile.length()} bytes"
                }
                println "========================================="
            }
        }
    }
}
